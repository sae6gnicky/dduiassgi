/* 연습하기 문제
   answer = 정답(띄어쓰기 된 문장)
   gaps   = 정답 기준, 각 글자 사이에 띄어야 하면 true
   rule   = 채점 후 보여줄 원칙 설명
*/
function makeGaps(answer) {
  // answer의 공백 위치를 글자 사이 gap 인덱스로 변환
  const chars = [];
  const spaceAfter = []; // chars[i] 뒤에 공백이 있는가
  for (let i = 0; i < answer.length; i++) {
    const c = answer[i];
    if (c === " ") {
      if (chars.length > 0) spaceAfter[chars.length - 1] = true;
    } else {
      chars.push(c);
      spaceAfter[chars.length - 1] = false;
    }
  }
  // gap j 는 chars[j] 와 chars[j+1] 사이 (j = 0 .. chars.length-2)
  const gaps = [];
  for (let j = 0; j < chars.length - 1; j++) gaps.push(!!spaceAfter[j]);
  return { chars, gaps };
}

//  easy   : 낱말 2개, 아주 짧고 원칙이 뚜렷한 문장
//  normal : 낱말 3개 안팎, 조금 더 긴 문장

  hard:   { name: "도전",  emoji: "🔥", color: "#ee5a6f", desc: "헷갈리는 말에 도전해요" },
};

const QUESTIONS_PER_GAME = 10; // 한 판에 낼 문제 수

// 배열을 무작위로 섞기 (Fisher–Yates)
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const PRACTICE = {};
Object.keys(RAW_PRACTICE).forEach(lv => {
  PRACTICE[lv] = RAW_PRACTICE[lv].map(p => {
    const g = makeGaps(p.answer);
    return { answer: p.answer, chars: g.chars, gaps: g.gaps, rule: p.rule };
  });
});

if (isNaN(totalStars)) totalStars = 0;
function addStars(n){
  totalStars += n;
  localStorage.setItem("ttz_stars", String(totalStars));
}

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// 예문 텍스트에서 [xxx] 는 붙는 말 강조, V 는 띄는 표시
function decorateExample(text){
  let t = esc(text);
  t = t.replace(/\[(.+?)\]/g, '<span class="attached">$1</span>');
  t = t.replace(/\s*V\s*/g, ' <span class="space-mark">V</span> ');
  return t;
}

/* ---------- 공부하기 ---------- */
function renderStudy(tabIndex){
  const section = STUDY[tabIndex];
  let tabs = STUDY.map((s,i) =>
    `<button class="chip ${i===tabIndex?'active':''}" data-i="${i}">${s.tab}</button>`
  ).join("");

  let body = "";
  if (section.tricky){
    body += `<div class="card" style="background:#fff0f3;border-color:#ffc9d4;">
      <div class="rule-plain" style="color:#c92a4a;">${section.intro}</div></div>`;
    section.tricky.forEach((t, idx) => {
      let spaces = t.space.map(s =>
        `<li>${decorateExample(s.ex)}<span class="why">👉 ${esc(s.mean)}</span></li>`
      ).join("");
      body += `
        <div class="card">
          <h2>${idx+1}. ‘${t.word}’</h2>
          <div class="rule-plain" style="color:#e8590c;">✅ 붙여 쓸 때</div>
          <ul class="ex-list">
            <li>${decorateExample(t.attach.ex)}<span class="why">👉 ${esc(t.attach.mean)}</span></li>
          </ul>
          <div class="rule-plain" style="color:#2f6b3d;">✅ 띄어 쓸 때</div>
          <ul class="ex-list">${spaces}</ul>
        </div>`;
    });
  } else {
    body = section.cards.map(c => {
      let exs = c.examples.map(e =>
        `<li>${decorateExample(e.text)}<span class="why">👉 ${esc(e.why)}</span></li>`
      ).join("");
      return `
        <div class="card">
          <h2>${esc(c.title)}</h2>
          <div class="rule-plain">${esc(c.plain)}</div>
          <div class="term-note">어른들은 이렇게 불러요 ${esc(c.term)}</div>
          <ul class="ex-list">${exs}</ul>
        </div>`;
    }).join("");
  }

  const isLast = tabIndex === STUDY.length - 1;
  const nav = isLast
    ? `<button class="big-btn btn-blue" id="toPractice">🎉 공부 끝! 연습하러 가기 ✏️</button>`
    : `<button class="big-btn btn-orange" id="nextTab">다음 ▶</button>`;

  app.innerHTML = `
    <div class="top-bar">
      <button class="home-link" id="home">🏠</button>
      <div class="page-title">📖 공부하기</div>
    </div>
    <div class="study-nav">${tabs}</div>
    ${body}
    <div class="study-footer">${nav}</div>
  `;

  document.getElementById("home").onclick = renderHome;
  document.querySelectorAll(".chip").forEach(ch => {
    ch.onclick = () => renderStudy(parseInt(ch.dataset.i));
  });
  if (isLast) document.getElementById("toPractice").onclick = renderLevelSelect;
  else document.getElementById("nextTab").onclick = () => { window.scrollTo(0,0); renderStudy(tabIndex+1); };
}

let userGaps = [];       // 사용자가 V 표시한 gap 상태
let curLevel = "easy";   // 현재 난이도
let sessionStars = 0;    // 이번 판에서 모은 별
let answered = false;    // 현재 문제 채점했는지
let currentSet = [];     // 이번 판에 낼 랜덤 10문제

function renderPractice(level, qIndex){
  curLevel = level;
  const L = LEVELS[level];

  if (qIndex === 0){
    sessionStars = 0; // 새 판 시작
    // 풀에서 무작위로 섞어 QUESTIONS_PER_GAME개만 뽑기
    const n = Math.min(QUESTIONS_PER_GAME, PRACTICE[level].length);
    currentSet = shuffle(PRACTICE[level]).slice(0, n);
  }
  const list = currentSet;

  if (qIndex >= list.length){
    // 결과 화면 (별 모으기)
    const total = list.length;
    const earned = sessionStars;
    addStars(earned);
    let starRow = "";
    for (let i = 0; i < total; i++){
      starRow += `<span class="result-star">${i < earned ? "⭐" : "☆"}</span>`;
    }
    let praise = earned === total ? "🏆 모두 맞혔어요! 최고예요!"
               : earned >= Math.ceil(total*0.6) ? "👍 정말 잘했어요!"
               : "💪 조금만 더 연습해요!";
    app.innerHTML = `
      <div class="top-bar"><button class="home-link" id="home">🏠</button>
        <div class="page-title">${L.emoji} ${L.name} 연습</div></div>
      <div class="done-msg">🎉 연습 끝!<br>${praise}</div>
      <div class="star-result">
        <div class="star-row">${starRow}</div>
        <div class="star-count">별 <b>${earned}</b> / ${total} 개 획득!</div>
      </div>
      <div class="star-bank">⭐ 지금까지 모은 별: <b>${totalStars}</b>개</div>
      <button class="big-btn" style="background:${L.color};" id="again">🔁 다시 도전</button>
      <button class="big-btn btn-blue" id="other">🎯 다른 난이도</button>
      <button class="big-btn btn-gray" id="home2">🏠 처음으로</button>`;
    document.getElementById("home").onclick = renderHome;
    document.getElementById("home2").onclick = renderHome;
    document.getElementById("other").onclick = renderLevelSelect;
    document.getElementById("again").onclick = () => renderPractice(level, 0);
    return;
  }

  answered = false;
  const q = list[qIndex];
  userGaps = new Array(q.chars.length - 1).fill(false);

  let inner = "";
  q.chars.forEach((c, i) => {
    inner += `<span class="char">${esc(c)}</span>`;
    if (i < q.chars.length - 1){
      inner += `<span class="gap" data-g="${i}"><span class="v">V</span></span>`;
    }
  });

  app.innerHTML = `
    <div class="top-bar"><button class="home-link" id="home">🏠</button>
      <div class="page-title">${L.emoji} ${L.name} 연습</div></div>
    <div class="practice-progress">${qIndex+1} / ${list.length} 번 &nbsp;·&nbsp; 이번 판 별 ⭐ ${sessionStars}</div>
    <div class="practice-guide">글자 사이를 콕 누르면 <span style="color:#10ac84;">V</span> 표시가 되고 띄어져요!</div>
    <div class="sentence-box" id="sbox">${inner}</div>
    <div class="practice-actions">
      <button class="big-btn btn-green" id="check">✅ 정답 확인</button>
    </div>
    <div id="resultArea"></div>
  `;

  document.getElementById("home").onclick = renderHome;

  document.querySelectorAll(".gap").forEach(g => {
    g.onclick = () => {
      if (answered) return;
      const idx = parseInt(g.dataset.g);
      userGaps[idx] = !userGaps[idx];
      g.classList.toggle("on", userGaps[idx]);
    };
  });

  document.getElementById("check").onclick = () => checkAnswer(level, qIndex);
}

function checkAnswer(level, qIndex){
  const list = currentSet;
  const q = list[qIndex];
  answered = true;
  let allCorrect = true;
  const gapEls = document.querySelectorAll(".gap");

  gapEls.forEach(g => {
    const idx = parseInt(g.dataset.g);
    const should = q.gaps[idx];      // 정답: 띄어야 하나
    const did = userGaps[idx];       // 사용자가 띄었나
    g.classList.remove("on");
    g.onclick = null; // 채점 후 잠금
    if (should && did){
      g.classList.add("on","correct"); // 맞게 띄움
    } else if (should && !did){
      g.classList.add("missed");       // 띄어야 하는데 안 띄움
      allCorrect = false;
    } else if (!should && did){
      g.classList.add("wrong-added");  // 안 띄어야 하는데 띄움
      allCorrect = false;
    }
  });

  // 정답이면 이번 판 별 +1 (다시 풀기 눌러도 중복 지급 안 되게 처리)
  let earnedNow = false;
  if (allCorrect){
    sessionStars += 1;
    earnedNow = true;
  }

  // 정답 문장 표시
  let ansHtml = "";
  q.chars.forEach((c,i) => {
    ansHtml += esc(c);
    if (i < q.chars.length-1 && q.gaps[i]) ansHtml += '<span class="sp"> V </span>';
  });

  const isLast = qIndex === list.length - 1;
  const area = document.getElementById("resultArea");
  area.innerHTML = `
    <div class="result-box ${allCorrect?'ok':'no'}">
      <div class="result-head">${allCorrect ? '🎉 정답이에요!' : '💪 다시 볼까요?'}</div>
      ${earnedNow ? '<div class="star-earn">⭐ 별 하나 획득!</div>' : ''}
      <div class="answer-line">${ansHtml}</div>
      <div class="explain">📌 <b>왜 그럴까요?</b><br>${q.rule}</div>
      ${allCorrect ? '' : `<div class="explain" style="background:#fff0f3;">
        🟧 주황색 = 여기를 <b>띄어야</b> 했어요 &nbsp; / &nbsp; 🟥 빨간색 = 여기는 <b>붙여야</b> 했어요</div>`}
    </div>
    <button class="big-btn btn-blue" id="next" style="margin-top:16px;">
      ${isLast ? '🎉 끝내기' : '다음 문제 ▶'}
    </button>
    ${allCorrect ? '' : '<button class="small-btn btn-gray" id="retry">🔁 이 문제 다시</button>'}
  `;
  document.getElementById("next").onclick = () => { window.scrollTo(0,0); renderPractice(level, qIndex+1); };
  const retryBtn = document.getElementById("retry");
  if (retryBtn) retryBtn.onclick = () => { window.scrollTo(0,0); renderPractice(level, qIndex); };
  document.getElementById("check").disabled = true;
  document.getElementById("check").style.opacity = ".5";
  area.scrollIntoView({behavior:"smooth", block:"nearest"});
}

/* 시작 */
renderHome();
</script>
</body>
</html>
